name: Build Chemistry Checkout Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemistry-checkout-android
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          set -e
          test -s index.html
          npm run build:web
          test -s www/index.html
          test -s www/sw.js

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Configure reliable Maven mirrors
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('android/settings.gradle'), Path('android/build.gradle'), Path('android/app/build.gradle')]
          mirror = "maven { url 'https://maven.aliyun.com/repository/google' }" + chr(10) + "        maven { url 'https://maven.aliyun.com/repository/public' }" + chr(10) + "        "
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace('google()', mirror + 'google()')
              path.write_text(text)
              print(f'Configured Maven mirrors in {path}')
          PY

      - name: Generate chemistry launcher icon
        run: |
          set -e
          npm install --no-save --no-audit --no-fund @capacitor/assets sharp
          mkdir -p assets
          node -e "require('sharp')('icon.svg').resize(1024,1024).png().toFile('assets/icon-only.png')"
          npx capacitor-assets generate --android

      - name: Sync bundled app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-checkout-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Publish Chemistry Checkout

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemistry-checkout-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate offline app files
        run: |
          set -e
          test -s index.html
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon.svg
          grep -qi '<!doctype html>' index.html
          grep -q 'const bank=' index.html
          grep -q 'navigator.serviceWorker.register' index.html
          grep -q 'CACHE_NAME' sw.js
          echo "Offline app validation passed."

      - name: Publish website to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github/**'

name: Publish Chemistry Checkout

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemistry-checkout-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate offline app files
        run: |
          set -e
          test -s index.html
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon.svg
          test -s questions-extra.js
          grep -qi '<!doctype html>' index.html
          grep -q 'const bank=' index.html
          grep -q 'navigator.serviceWorker.register' index.html
          grep -q 'CACHE_NAME' sw.js
          echo "Offline app validation passed."

      - name: Package downloadable offline app
        run: |
          set -e
          mkdir -p dist
          cp index.html sw.js manifest.webmanifest icon.svg questions-extra.js dist/
          if [ -f README.md ]; then cp README.md dist/; fi
          cd dist
          zip -r ../chemistry-checkout-offline.zip .
          cd ..

      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-checkout-offline
          path: chemistry-checkout-offline.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish website to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github/**'

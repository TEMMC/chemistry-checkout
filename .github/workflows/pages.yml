name: Build and deploy Chemistry Checkout

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chemistry-checkout-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate offline app files
        run: |
          set -e
          test -s index.html
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon.svg
          grep -qi '<!doctype html>' index.html
          grep -q 'const bank=' index.html
          grep -q 'navigator.serviceWorker.register' index.html
          grep -q 'CACHE_NAME' sw.js
          echo "Offline app files and service worker registration are present."

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
